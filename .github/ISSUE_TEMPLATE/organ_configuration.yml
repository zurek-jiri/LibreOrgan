name: Organ configuration
description: Publish your organ configuration - attach the zip and the README OrganSampler wrote, a robot proposes them, the maintainer merges.
title: "[Configuration] "
labels: ["configuration"]
body:
  - type: markdown
    attributes:
      value: |
        Save the organ with *Portable configuration (to share with others)* ticked: OrganSampler writes `<name>.zip` (the configuration
        inside) and `<name>.README.md` beside it, asking you once for the organ, the producer and product of the samples, **the link
        to the page where the sample folders are bought or downloaded** and your name. Then attach the two files below.
        A robot checks them, puts them into the repository as a pull request and answers here; the maintainer merges it and the organ
        appears in [configurations/INDEX.md](https://github.com/zurek-jiri/OrganSampler/blob/main/configurations/INDEX.md).
        If something is missing, the robot says what - edit this issue and it tries again.
        **Never attach samples or impulse responses.** They are bought or downloaded elsewhere (Sonus Paradisi); a configuration only names the folders it needs.
  - type: input
    id: organ
    attributes:
      label: Organ
      description: The instrument and the producer of its sample folders, as in the README.
      placeholder: "Stralsund, St. Jakobi, Wegscheider organ - Sonus Paradisi"
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files
      description: Drag `<name>.zip` and `<name>.README.md` here (the two files OrganSampler wrote beside the portable configuration). Nothing else.
      placeholder: Drop the two files here.
    validations:
      required: true
  - type: checkboxes
    id: licence
    attributes:
      label: Publication
      options:
        - label: I made this configuration myself and agree to its publication in this repository under the repository's licence (GPLv3); it contains no sample data.
          required: true
