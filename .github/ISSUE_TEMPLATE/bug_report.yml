name: Bug report
description: Something went wrong - a crash, a dropout, a wrong sound, a dialog that misbehaves.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Drag logs.zip here - the one file in the report folder the program opened ("Report a problem..." in the Configuration Editor). It holds the activity log, the crash logs, settings.json, system.txt and pictures of the program's windows - no sample data. This drag is the one step no program can do for you (GitHub takes files only this way), and without the zip a report cannot be worked on. A picture is not a log.
      placeholder: Drag logs.zip into this field.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: LibreOrgan Sampler version
      description: Shown in the window title and in Configuration Editor > About & licences.
      placeholder: "0.8.50"
  - type: input
    id: os
    attributes:
      label: Operating system
      description: Filled in by "Report a problem" (GitHub does not take a dropdown value from the link, a text field it does). Windows 10/11, macOS with its version, or the Linux distribution.
      placeholder: "Windows 11 / macOS 14.5 / Linux Mint 22"
  - type: input
    id: audio
    attributes:
      label: Audio driver and device
      description: Filled in by "Report a problem" (the driver and device of the routes; see them in the Audio routing).
      placeholder: "ASIO, RME Fireface UCX, buffer 256 at 48 kHz"
  - type: input
    id: samples
    attributes:
      label: Sample folders and configuration
      description: Which sample folders (and which organ configuration file, if you loaded one). Attach the configuration .json if the problem concerns it - never the samples.
      placeholder: "Sonus Paradisi Stralsund, my own configuration (attached)"
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: A few words are enough - what you saw or heard.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Optional - a few words are enough when the log is attached.
      placeholder: |
        1. Load the configuration ...
        2. Open the Audio routing ...
        3. Drag the cable of Front onto ...
  - type: textarea
    id: system
    attributes:
      label: System
      description: Filled in by "Report a problem" (the program, the computer, the render threads, the configuration and every audio route as they were). Leave it as it is.
      render: text
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional. The pictures of the program's windows are inside logs.zip already - drag an image here only when you want it shown in the issue itself.
  - type: textarea
    id: hardware
    attributes:
      label: Computer
      description: CPU, RAM, audio interface. (The report's system.txt has this; then leave it empty.)
      placeholder: "AMD Ryzen 9 5950X, 64 GB, RME Fireface UCX"
