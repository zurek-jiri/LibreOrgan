name: Remove my configuration
description: Take a configuration you published off the list - tick the organ, a robot removes it.
title: "[Remove configuration] "
labels: ["configuration-remove"]
body:
  - type: markdown
    attributes:
      value: |
        Tick the organ (or several) in the list and press *Submit new issue*. A robot removes the folder when you are
        the one who published it (or the maintainer), answers here and closes this issue. The list is written by the
        robot from [libreorgans/INDEX.md](https://github.com/zurek-jiri/LibreOrgan/blob/main/libreorgans/INDEX.md);
        the *remove* link of an organ's line there opens this form with that organ's folder filled into the name
        field below (GitHub does not pre-tick the list) - just press *Submit new issue*; tick organs here to remove
        several at once. To publish a new version instead, send the new zip with the "Organ configuration" form:
        it replaces the old one by itself.
  - type: dropdown
    id: organ
    attributes:
      label: Organ
      description: The configuration folder(s) to remove, as listed in INDEX.md.
      multiple: true
      options:
        - "adlington-hall-smith"
        - "adriatic-organ-model"
        - "altenbruch-klapmeyer-organ"
        - "arnstadt-wender-bach-organ"
        - "ashton-albion-church-lewis-organ"
        - "b-ckeburg-janke-organ"
        - "bellevue-casavant"
        - "bergen-op-zoom-ibach-organ"
        - "beziers-cathedral-puget"
        - "billerbeck-dom-fleiter-organ"
        - "brasov-black-church-buchholz-organ"
        - "brescia-st-carlo-antegnati-organ"
        - "burton-berlin-hill"
        - "caen-st-etienne-cavaill-coll"
        - "cembalo-mietke-model"
        - "cembalo-ruckers-model"
        - "chapelet-spanish-collection"
        - "chemnitz-lutherkirche-sauer-organ"
        - "doesburg-martinikerk-walcker"
        - "doksy-kruh-renaissance-organ"
        - "dom-b-dos-organ-model"
        - "este-st-maria-delle-grazie-mascioni-organ"
        - "forcalquier-organ-model"
        - "frankfurt-oder-sauer-op-2025"
        - "greccio-s-francesco-spada-organ"
        - "hildesheim-st-andreas-beckerath-organ"
        - "hradec-kralove-st-maria-streussel-organ"
        - "stralsund-st-jakobi-kr-wegscheider"
        - "yokota-centennial-g-silbermann"
    validations:
      required: false
  - type: input
    id: name
    attributes:
      label: Or any part of its name
      description: When the list above does not fit - any part of the organ's name (case does not matter).
      placeholder: "Stralsund"
    validations:
      required: false
