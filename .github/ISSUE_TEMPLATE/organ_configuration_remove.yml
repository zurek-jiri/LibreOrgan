name: Remove my configuration
description: Take a configuration you published off the list - name the organ, a robot removes it.
title: "[Remove configuration] "
labels: ["configuration-remove"]
body:
  - type: markdown
    attributes:
      value: |
        Name the organ as it stands in [configurations/INDEX.md](https://github.com/zurek-jiri/OrganSampler/blob/main/configurations/INDEX.md) -
        any part of its name is enough (case does not matter). A robot removes the folder when you are the one who published it
        (or the maintainer), answers here and closes this issue. When several organs match, it lists them: edit the issue with more of the name.
        To publish a new version instead, send the new zip and README with the "Organ configuration" form: it replaces the old one by itself.
  - type: input
    id: organ
    attributes:
      label: Organ
      description: The organ to remove - any part of its name.
      placeholder: "Stralsund"
    validations:
      required: true
