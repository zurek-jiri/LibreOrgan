# Puts a published configuration into the "Featured" table of libreorgans/INDEX.md
# or takes it out again, without Git: GitHub > Actions > "Feature a configuration" >
# Run workflow > any part of the organ's name (the folder, the README title or the organ
# as named at the save; case does not matter) + feature / unfeature > Run workflow.
# One match: libreorgans/FEATURED.txt is edited, INDEX.md regenerated, both committed
# to main; several matches: they are listed and nothing happens. (Editing FEATURED.txt
# by hand on GitHub does the same - the index job regenerates INDEX.md on the push.)
name: Feature a configuration

on:
  workflow_dispatch:
    inputs:
      organ:
        description: "The organ: any part of its name (folder, README title or the organ as named at the save)"
        required: true
        type: string
      action:
        description: "feature = into the Featured table, unfeature = out of it"
        required: true
        type: choice
        options: [ feature, unfeature ]
        default: feature

permissions:
  contents: write

jobs:
  feature:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      INPUT_ORGAN: ${{ github.event.inputs.organ }}
      INPUT_ACTION: ${{ github.event.inputs.action }}
    steps:
      - uses: actions/checkout@v4
      - name: Find the organ, edit FEATURED.txt, write libreorgans/INDEX.md
        shell: bash
        run: |
          set -e
          wanted="$(echo "$INPUT_ORGAN" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          [ -n "$wanted" ] || { echo "::error::No organ was named."; exit 1; }
          matches="$(python3 .github/scripts/configuration_tools.py find "$wanted")"
          count=$(printf '%s' "$matches" | grep -c . || true)
          if [ "$count" -eq 0 ]; then
            echo "::error::No published configuration matches \"$wanted\". The organs now:"
            ls -1 libreorgans | grep -v '\.md$' | grep -v '\.txt$' || true
            exit 1
          fi
          if [ "$count" -gt 1 ]; then
            echo "::error::\"$wanted\" matches $count configurations - give more of the name:"
            printf '%s\n' "$matches" | awk -F'|' '{printf "- %s (%s)\n", $1, $2}'
            exit 1
          fi
          folder="$(printf '%s' "$matches" | cut -d'|' -f1)"
          list=libreorgans/FEATURED.txt
          [ -f "$list" ] || printf '# Featured configurations: one folder name per line.\n' > "$list"
          if [ "$INPUT_ACTION" = "feature" ]; then
            if grep -qix "$folder" "$list"; then echo "$folder is featured already"; exit 0; fi
            printf '%s\n' "$folder" >> "$list"
            echo "$folder added to FEATURED.txt"
          else
            if ! grep -qix "$folder" "$list"; then echo "$folder was not featured"; exit 0; fi
            grep -vix "$folder" "$list" > "$list.new" && mv "$list.new" "$list"
            echo "$folder taken out of FEATURED.txt"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 .github/scripts/configurations_index.py || true
          git add -A libreorgans .github/ISSUE_TEMPLATE/organ_configuration_remove.yml
          git commit -m "configurations: $folder ${INPUT_ACTION}d (Feature a configuration, run by ${{ github.actor }})"
          git push
