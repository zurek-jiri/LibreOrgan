# Removes a published configuration, without Git. Two ways:
#  - the maintainer: GitHub > Actions > "Remove a configuration" > Run workflow >
#    any part of the organ's name (the folder, the README title or the organ as
#    named at the save; case does not matter) > Run workflow. One match: the
#    folder goes; several: they are listed and nothing happens - give more of
#    the name.
#  - anybody: the issue form "Remove my configuration" (label
#    configuration-remove) with the same kind of name; the organ is removed when
#    the issue's author is the one who published it (recorded in its README) or
#    the repository's owner. The robot answers in the issue and closes it.
# The folder is deleted, INDEX.md and its sorted copies are regenerated, the
# change is committed to main. The Rural Organ demo is never removed.
name: Remove a configuration

on:
  workflow_dispatch:
    inputs:
      organ:
        description: "The organ to remove: any part of its name (folder, README title or the organ as named at the save)"
        required: true
        type: string
  issues:
    types: [ opened, edited ]

permissions:
  contents: write
  issues: write

jobs:
  remove:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'configuration-remove')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      INPUT_ORGAN: ${{ github.event.inputs.organ }}
      REPO_OWNER: ${{ github.repository_owner }}
      BY_ISSUE: ${{ github.event_name == 'issues' }}
    steps:
      - uses: actions/checkout@v4
      - name: Find the organ, remove its folder, write libreorgans/INDEX.md
        shell: bash
        run: |
          set -e
          answer() {   # the message: the issue (closed when $2 = close) or the job log
            if [ "$BY_ISSUE" = "true" ]; then
              gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$1"
              [ "$2" = "close" ] && gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" || true
            fi
            echo "$1"
          }
          # What was asked for: the form's dropdown "Organ" (one folder per line, several ticked = "a, b";
          # "_No response_" when none), the field "Or any part of its name", or the dispatch input.
          field() { printf '%s\n' "$ISSUE_BODY" | awk -v h="### $1" 'index($0, h) == 1 {f=1; next} /^### /{f=0} f' | sed '/^\s*$/d' | head -n 1 | tr -d '\r' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//'; }
          wanted=""
          if [ "$BY_ISSUE" = "true" ]; then
            picked="$(field "Organ")"
            [ "$picked" = "_No response_" ] && picked=""
            typed="$(field "Or any part of its name")"
            [ "$typed" = "_No response_" ] && typed=""
            wanted="$(printf '%s\n%s' "$(printf '%s' "$picked" | sed 's/, */\n/g')" "$typed" | sed '/^\s*$/d')"
            who="$ISSUE_AUTHOR"
          else
            wanted="$INPUT_ORGAN"
            who="${{ github.actor }}"
          fi
          if [ -z "$wanted" ]; then answer "No organ was named." ; exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          removed=""; problems=""
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            matches="$(python3 .github/scripts/configuration_tools.py find "$name")"
            count=$(printf '%s' "$matches" | grep -c . || true)
            if [ "$count" -eq 0 ]; then problems="$problems"$'\n'"- \"$name\": no published configuration matches it"; continue; fi
            if [ "$count" -gt 1 ]; then problems="$problems"$'\n'"- \"$name\" matches $count configurations - give more of the name: $(printf '%s\n' "$matches" | awk -F'|' '{printf "%s (%s); ", $1, $2}')"; continue; fi
            folder="$(printf '%s' "$matches" | cut -d'|' -f1)"
            publisher="$(printf '%s' "$matches" | cut -d'|' -f4)"
            if [ "$folder" = "rural-organ" ]; then problems="$problems"$'\n'"- the Rural Organ demo stays"; continue; fi
            if [ "$BY_ISSUE" = "true" ] && [ "$who" != "$REPO_OWNER" ] && [ "$who" != "$publisher" ]; then
              problems="$problems"$'\n'"- libreorgans/$folder was published by ${publisher:+@$publisher}${publisher:-somebody else (before the publisher was recorded)} - only they or the repository's owner can remove it"
              continue
            fi
            git rm -r -q "libreorgans/$folder"
            removed="$removed"$'\n'"- libreorgans/$folder"
          done <<< "$wanted"
          if [ -z "$removed" ]; then
            answer "$(printf 'Nothing removed:%s\n\nThe organs now:\n\n%s' "$problems" "$(ls -1 libreorgans | grep -v '\.md$' | sed 's/^/- /')")"
            exit 1
          fi
          python3 .github/scripts/configurations_index.py || true
          git add -A libreorgans .github/ISSUE_TEMPLATE/organ_configuration_remove.yml
          git commit -m "libreorgans: removed$(printf '%s' "$removed" | tr '\n' ' ' | sed 's/- libreorgans\//  /g') (asked by @$who)"
          git push
          answer "$(printf 'Removed, INDEX.md regenerated:%s%s' "$removed" "${problems:+$'\n\nNot removed:'$problems}")" close
