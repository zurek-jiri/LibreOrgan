# Removes a published configuration, without Git. Two ways:
#  - the maintainer: GitHub > Actions > "Remove a configuration" > Run workflow >
#    any part of the organ's name (the folder, the README title or the organ as
#    named at the save; case does not matter) > Run workflow. One match: the
#    folder goes; several: they are listed and nothing happens - give more of
#    the name.
#  - anybody: the issue form "Remove my configuration" (label
#    configuration-remove) with the same kind of name; the organ is removed when
#    the issue's author is the one who published it (recorded in its README) or
#    the repository's owner. The robot answers in the issue and closes it.
# The folder is deleted, INDEX.md and its sorted copies are regenerated, the
# change is committed to main. The Rural Organ demo is never removed.
name: Remove a configuration

on:
  workflow_dispatch:
    inputs:
      organ:
        description: "The organ to remove: any part of its name (folder, README title or the organ as named at the save)"
        required: true
        type: string
  issues:
    types: [ opened, edited ]

permissions:
  contents: write
  issues: write

jobs:
  remove:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'configuration-remove')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      INPUT_ORGAN: ${{ github.event.inputs.organ }}
      REPO_OWNER: ${{ github.repository_owner }}
      BY_ISSUE: ${{ github.event_name == 'issues' }}
    steps:
      - uses: actions/checkout@v4
      - name: Find the organ, remove its folder, write configurations/INDEX.md
        shell: bash
        run: |
          set -e
          answer() {   # the message: the issue (closed when $2 = close) or the job log
            if [ "$BY_ISSUE" = "true" ]; then
              gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$1"
              [ "$2" = "close" ] && gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" || true
            fi
            echo "$1"
          }
          if [ "$BY_ISSUE" = "true" ]; then
            # The form's "Organ" field: the text under the "### Organ" heading of the issue body.
            wanted="$(printf '%s\n' "$ISSUE_BODY" | awk '/^### Organ/{f=1; next} /^### /{f=0} f' | sed '/^\s*$/d' | head -n 1 | tr -d '\r')"
            who="$ISSUE_AUTHOR"
          else
            wanted="$INPUT_ORGAN"
            who="${{ github.actor }}"
          fi
          wanted="$(echo "$wanted" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          if [ -z "$wanted" ]; then answer "No organ was named." ; exit 1; fi
          matches="$(python3 .github/scripts/configuration_tools.py find "$wanted")"
          count=$(printf '%s' "$matches" | grep -c . || true)
          if [ "$count" -eq 0 ]; then
            answer "$(printf 'No published configuration matches "%s". The organs now:\n\n%s' "$wanted" "$(ls -1 configurations | grep -v '\.md$' | sed 's/^/- /')")"
            exit 1
          fi
          if [ "$count" -gt 1 ]; then
            answer "$(printf '"%s" matches %d configurations - give more of the name:\n\n%s' "$wanted" "$count" "$(printf '%s\n' "$matches" | awk -F'|' '{printf "- %s (%s)\n", $1, $2}')")"
            exit 1
          fi
          folder="$(printf '%s' "$matches" | cut -d'|' -f1)"
          publisher="$(printf '%s' "$matches" | cut -d'|' -f4)"
          if [ "$folder" = "rural-organ" ]; then answer "The Rural Organ demo stays."; exit 1; fi
          if [ "$BY_ISSUE" = "true" ] && [ "$who" != "$REPO_OWNER" ] && [ "$who" != "$publisher" ]; then
            answer "$(printf 'configurations/%s was published by %s - only they or the repository'"'"'s owner can remove it.' "$folder" "${publisher:+@$publisher}${publisher:-somebody else (before the publisher was recorded)}")"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r -q "configurations/$folder"
          python3 .github/scripts/configurations_index.py || true
          git add -A configurations
          git commit -m "configurations: $folder removed (asked by @$who)"
          git push
          answer "configurations/$folder removed, INDEX.md regenerated." close
