name: Build retry

# GitHub now and then gives a macOS job no runner at all: the job is cancelled
# 15 minutes after it was queued with "The job was not acquired by Runner of
# type hosted even after multiple attempts" (capacity of the macOS arm64
# runners), the release job is skipped and the release stays at the old
# version. Such a run is started again here by itself - the jobs that did not
# run only, twice at most. A job that ran and failed (a compile error) is never
# retried: that needs a fix, not a second try.
on:
  workflow_run:
    workflows: [ "Build" ]
    types: [ completed ]

permissions:
  actions: write

jobs:
  retry:
    if: github.event.workflow_run.conclusion != 'success' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: Run the jobs again that never got a runner
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # 24 Nov 2026: a build cancelled because a NEWER version came (build.yml cancels them) is never started
          # again - it would wait for the same runners and cancel the newer one in its turn.
          # ... and not by the tag's NAME alone: a tag moved onto a newer commit leaves older runs of the same
          # name behind (v0.9.132 was moved twice and its three runs kept starting and cancelling one another).
          newest=$(gh api "repos/$REPO/tags?per_page=100" --jq '.[].name' | grep '^v[0-9]' | sort -V | tail -1)
          case "$TAG" in
            v[0-9]*)
              if [ -n "$newest" ] && [ "$TAG" != "$newest" ]; then echo "$TAG is not the newest version ($newest): nothing to retry"; exit 0; fi
              now=$(gh api "repos/$REPO/commits/$TAG" --jq '.sha' 2>/dev/null || true)
              if [ -n "$now" ] && [ "$now" != "$SHA" ]; then echo "$TAG stands on $now now, this run built $SHA: nothing to retry"; exit 0; fi ;;
          esac
          jobs=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100")
          lost=$(echo "$jobs" | jq '[.jobs[] | select(.conclusion == "cancelled" and (.steps | length) == 0)] | length')
          # 25 Nov 2026 (v0.9.134: every build green, the release job failed with "Too many retries" of the release
          # action - GitHub's side): a failed RELEASE job with every build done is tried again too; nothing is rebuilt.
          broken=$(echo "$jobs" | jq '[.jobs[] | select(.conclusion == "failure" and (.steps | length) > 0 and .name != "release" and (.name | test("test build") | not))] | length')
          release=$(echo "$jobs" | jq '[.jobs[] | select(.conclusion == "failure" and .name == "release")] | length')
          echo "jobs without a runner: $lost, build jobs that ran and failed: $broken, the release job failed: $release"
          if { [ "$lost" -gt 0 ] || [ "$release" -gt 0 ]; } && [ "$broken" -eq 0 ]; then
            gh run rerun "$RUN_ID" --repo "$REPO" --failed
            echo "run $RUN_ID started again (its failed and cancelled jobs)"
          else
            echo "nothing to retry"
          fi
