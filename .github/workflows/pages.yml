name: Website

on:
  push:
    branches: [ main ]
    paths: [ 'site/**', '.github/workflows/pages.yml' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Two jobs on purpose: with the upload and the deployment in ONE job the deployment
# asked for the artifact before GitHub listed it ("No artifacts named github-pages
# were found for this workflow run") - 4 of 14 runs failed that way. The deployment
# is also tried once more after 45 s when it fails.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.again.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - id: again
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
