name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every build is published as the platform's native archive (package):
          # a zip on Windows and macOS, a tar.gz on Linux (it keeps the executable
          # bit, so no chmod +x after unpacking). Never a bare executable.
          - name: Windows
            os: windows-latest
            artifact: OrganSampler-windows
            path: build/OrganSampler_artefacts/Release/OrganSampler.exe
            package: OrganSampler-windows.zip
          - name: macOS
            os: macos-latest
            artifact: OrganSampler-macos
            path: build/OrganSampler_artefacts/Release/OrganSampler.app
            package: OrganSampler-macos.zip
            cmake: -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          # A test build for old Intel Macs (macOS 10.11 El Capitan and later - the
          # lowest JUCE allows). Untested by the project itself; it must not block
          # the release when the toolchain balks.
          - name: macOS 10.11 Intel (test build)
            os: macos-latest
            artifact: OrganSampler-macos-10.11-intel
            path: build/OrganSampler_artefacts/Release/OrganSampler.app
            package: OrganSampler-macos-10.11-intel.zip
            # -faligned-allocation: C++17 aligned new/delete come from AlignedNew.cpp (the system
            # ones exist from 10.13). libc++'s availability stays ON: with it disabled
            # (-D_LIBCPP_DISABLE_AVAILABILITY) the headers assumed every libc++ symbol of the
            # build machine's macOS in the dylib, and the binary imported symbols a 10.13
            # libc++ lacks (std::__hash_memory, the bad_function_call key function) -
            # "dyld: Symbol not found" at start.
            cmake: -DCMAKE_OSX_DEPLOYMENT_TARGET=10.11 -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_CXX_FLAGS="-faligned-allocation -Wno-unguarded-availability -Wno-unguarded-availability-new" -DCMAKE_OBJCXX_FLAGS="-faligned-allocation -Wno-unguarded-availability -Wno-unguarded-availability-new"
            optional: true
          - name: Linux
            os: ubuntu-latest
            artifact: OrganSampler-linux
            path: build/OrganSampler_artefacts/Release/OrganSampler
            package: OrganSampler-linux-x86_64.tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Linux dependencies (JUCE)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxi-dev libegl-dev libglu1-mesa-dev mesa-common-dev xvfb

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake }}

      - name: Build
        run: cmake --build build --config Release --parallel

      # The engine self-test on synthetic velocity-layer folders (no audio device, no
      # window). It must not block the artifacts, so a failure only marks the step.
      - name: Self-test (engine, synthetic sample folders)
        if: runner.os != 'macOS'
        continue-on-error: true
        shell: pwsh
        run: |
          pwsh -File OrganSampler/Tests/gui/make_vel_test.ps1
          $set = Join-Path ([IO.Path]::GetTempPath()) "vel_test"
          if ($IsWindows) {
            & "build/OrganSampler_artefacts/Release/OrganSampler.exe" --selftest "$set"
            $report = Join-Path $env:APPDATA "OrganSampler/selftest.txt"
          } else {
            xvfb-run -a "build/OrganSampler_artefacts/Release/OrganSampler" --selftest "$set"
            $report = Join-Path $HOME ".config/OrganSampler/selftest.txt"
          }
          if (-not (Test-Path $report)) { throw "no self-test report at $report" }
          Get-Content $report | Select-String -Pattern 'WRONG|FAIL|COMPLETED'
          if (-not (Select-String -Path $report -Pattern 'COMPLETED WITHOUT CRASH' -Quiet)) { throw "self-test did not complete" }

      # The interpolation kernels of the platform against the scalar one (AVX2 and
      # SSE2 on x86-64, NEON on Apple silicon) and their speed. Runs everywhere, the
      # macOS runners included; a mismatch fails the step, not the artifacts.
      - name: Kernel test (SIMD kernels vs scalar, speed)
        continue-on-error: true
        shell: pwsh
        run: |
          if ($IsWindows) { $exe = "build/OrganSampler_artefacts/Release/OrganSampler.exe" }
          elseif ($IsMacOS) { $exe = "build/OrganSampler_artefacts/Release/OrganSampler.app/Contents/MacOS/OrganSampler" }
          else { $exe = "build/OrganSampler_artefacts/Release/OrganSampler" }
          if ($IsLinux) { xvfb-run -a $exe --kerneltest } else { & $exe --kerneltest }
          if ($LASTEXITCODE -ne 0) { throw "kernel test failed with exit code $LASTEXITCODE" }

      - name: Package (macOS - zip of the app bundle)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "${{ matrix.path }}" "${{ matrix.package }}"

      - name: Package (Windows - zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "${{ matrix.path }}" -DestinationPath "${{ matrix.package }}" -CompressionLevel Optimal

      - name: Package (Linux - tar.gz, executable bit kept)
        if: runner.os == 'Linux'
        run: |
          chmod +x "${{ matrix.path }}"
          tar -czf "${{ matrix.package }}" -C "$(dirname "${{ matrix.path }}")" "$(basename "${{ matrix.path }}")"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.package }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # Every build is a pre-release for testers until the first release the
      # project is satisfied with; the badge says so on the releases page.
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          prerelease: true
          body: |
            Pre-release build for testers - not an official release yet.

            **One program, no installation: download the archive of your system below, unpack it, start the program.**

            - **Windows 10/11 (64-bit):** `OrganSampler-windows.zip` - `OrganSampler.exe` inside.
            - **macOS, Apple silicon (macOS 11 Big Sur or newer):** `OrganSampler-macos.zip` - the app inside. Unsigned: right-click > Open the first time.
            - **macOS, Intel (macOS 10.11 El Capitan or newer):** `OrganSampler-macos-10.11-intel.zip` - the app inside. Unsigned: right-click > Open the first time. Untested by the project.
            - **Linux x86-64 (glibc 2.38 or newer: Ubuntu 24.04, Mint 22, Debian 13, Fedora 39 and newer):** `OrganSampler-linux-x86_64.tar.gz` - `tar xzf` it; the program is executable as it comes.
            - The two *Source code* entries are added by GitHub to every release: not needed for playing.

            **Organs to play: [Configurations, Organs](https://github.com/zurek-jiri/OrganSampler/blob/main/configurations/INDEX.md)** - ready-made configurations for sample folders in wave format from [Sonus Paradisi](https://www.sonusparadisi.cz/en/organs.html) ([free material](https://www.sonusparadisi.cz/en/free-stuff.html)); to start at once, [the Rural Organ demo](https://github.com/zurek-jiri/OrganSampler/releases/tag/rural-organ-0.8) brings its own sample folders.
      # Only the newest build stays on the releases page: every older v* release
      # (and its tag) is deleted; the Rural Organ demo release is kept.
      - name: Delete the older program releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="${GITHUB_REF_NAME}"
          # Each tag once (a release listed twice made the second delete fail on the tag
          # already gone, 0.8.154); a release or tag gone by then is no failure.
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' | sort -u); do
            case "$tag" in
              v*) if [ "$tag" != "$current" ]; then
                    echo "deleting $tag"
                    gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || echo "$tag: already gone"
                  fi ;;
            esac
          done
