name: Build

on:
  push:
    # Tags only (3 Nov 2026): a push to main built the same commit a second time
    # beside the tag's run and held the few macOS runners - the release comes
    # from the tag alone; "Run workflow" below builds any branch on demand.
    # 25 Nov 2026 (the user: "nesmíme plýtvat prostředky gitHubu na stavění opakované"): ONE build per version - the
    # tag's run builds, tests and publishes. A version whose build fails is not released and the fix gets the next
    # number; never a trial build before the tag (the branch "ci-check" of 0.9.135 built everything twice).
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

# 24 Nov 2026 (five versions in one evening, each build waiting for a macOS runner behind the one before): only
# the NEWEST version is built. A new tag's run cancels the release builds still queued or running (the job
# "supersede" below does it for runs of any age; the group does it for runs started with this file).
concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || github.ref }}
  cancel-in-progress: true

jobs:
  supersede:
    name: older builds cancelled
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      actions: write
    steps:
      - name: Cancel the builds of older versions that have not finished
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.run_number }}
        run: |
          gh api "repos/$REPO/actions/workflows/build.yml/runs?per_page=40" \
            --jq ".workflow_runs[] | select(.status != \"completed\" and .run_number < $NUMBER and ((.head_branch // \"\") | startswith(\"v\"))) | \"\(.id) \(.head_branch)\"" |
          while read -r id tag; do
            echo "cancelling the build of $tag (run $id)"
            gh run cancel "$id" --repo "$REPO" || true
          done

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every build is published as the platform's native archive (package):
          # a zip on Windows and macOS, a tar.gz on Linux (it keeps the executable
          # bit, so no chmod +x after unpacking). Never a bare executable.
          - name: Windows
            os: windows-latest
            artifact: LibreOrgan-windows
            path: build/LibreOrgan_artefacts/Release/LibreOrgan.exe
            package: LibreOrgan-windows.zip
          - name: macOS
            os: macos-latest
            artifact: LibreOrgan-macos
            path: build/LibreOrgan_artefacts/Release/LibreOrgan.app
            package: LibreOrgan-macos.zip
            cmake: -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          # A test build for old Intel Macs (macOS 10.11 El Capitan and later - the
          # lowest JUCE allows). Untested by the project itself; it must not block
          # the release when the toolchain balks.
          - name: macOS 10.11 Intel (test build)
            os: macos-latest
            artifact: LibreOrgan-macos-10.11-intel
            path: build/LibreOrgan_artefacts/Release/LibreOrgan.app
            package: LibreOrgan-macos-10.11-intel.zip
            # -faligned-allocation: C++17 aligned new/delete come from AlignedNew.cpp (the system
            # ones exist from 10.13). libc++'s availability stays ON: with it disabled
            # (-D_LIBCPP_DISABLE_AVAILABILITY) the headers assumed every libc++ symbol of the
            # build machine's macOS in the dylib, and the binary imported symbols a 10.13
            # libc++ lacks (std::__hash_memory, the bad_function_call key function) -
            # "dyld: Symbol not found" at start.
            cmake: -DCMAKE_OSX_DEPLOYMENT_TARGET=10.11 -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_CXX_FLAGS="-faligned-allocation -Wno-unguarded-availability -Wno-unguarded-availability-new" -DCMAKE_OBJCXX_FLAGS="-faligned-allocation -Wno-unguarded-availability -Wno-unguarded-availability-new"
            optional: true
          # PINNED (3 Nov 2026): ubuntu-latest became ubuntu-26.04 (GCC 15, glibc 2.43) overnight and the
          # 0.9.44 binary asked for GLIBC_2.43 - the loader refused it on Debian 13 (glibc 2.41) without a
          # word. ubuntu-24.04 links against glibc 2.39 / GLIBCXX of GCC 13, which every current distribution has.
          - name: Linux
            os: ubuntu-24.04
            artifact: LibreOrgan-linux
            path: build/LibreOrgan_artefacts/Release/LibreOrgan
            package: LibreOrgan-linux-x86_64.tar.gz
          # Linux on 64-bit ARM: Raspberry Pi 4/5 with a 64-bit OS (the NEON kernel). Built
          # on the 22.04 ARM runner (glibc 2.35) so that Raspberry Pi OS Bookworm (2.36) runs
          # it. Untested on real hardware by the project yet; it must not block the release.
          - name: Linux arm64 (Raspberry Pi, test build)
            os: ubuntu-22.04-arm
            artifact: LibreOrgan-linux-arm64
            path: build/LibreOrgan_artefacts/Release/LibreOrgan
            package: LibreOrgan-linux-arm64.tar.gz
            optional: true
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Linux dependencies (JUCE)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxi-dev libegl-dev libglu1-mesa-dev mesa-common-dev xvfb

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake }}

      - name: Build
        run: cmake --build build --config Release --parallel

      # The engine self-test on synthetic velocity-layer folders (no audio device, no
      # window). It must not block the artifacts, so a failure only marks the step.
      - name: Self-test (engine, synthetic sample folders)
        if: runner.os != 'macOS'
        continue-on-error: true
        shell: pwsh
        env:
          LC_ALL: C.UTF-8
        # 24 Nov 2026: this step and the next had shown a red cross in EVERY build for weeks ("Process completed
        # with exit code 1", the step allowed to fail). On Windows the program is a window program: "& exe" does
        # not wait for it, so the report was looked for before it was written - Start-Process and a wait. And a
        # step that fails says WHY in an annotation (the job logs cannot be read without a login).
        run: |
          pwsh -File LibreOrgan/Tests/gui/make_vel_test.ps1
          $set = Join-Path ([IO.Path]::GetTempPath()) "vel_test"
          if ($IsWindows) {
            $report = Join-Path $env:APPDATA "LibreOrgan/selftest.txt"
            $p = Start-Process -FilePath "build/LibreOrgan_artefacts/Release/LibreOrgan.exe" -ArgumentList @('--selftest', "`"$set`"") -PassThru
            if (-not $p.WaitForExit(600000)) { $p.Kill(); Write-Host "::error title=Self-test::did not end within 10 minutes"; exit 1 }
          } else {
            xvfb-run -a "build/LibreOrgan_artefacts/Release/LibreOrgan" --selftest "$set"
            $report = Join-Path $HOME ".config/LibreOrgan/selftest.txt"
          }
          if (-not (Test-Path $report)) { Write-Host "::error title=Self-test::no report at $report"; exit 1 }
          Get-Content $report | Select-String -Pattern 'WRONG|FAIL|COMPLETED'
          if (-not (Select-String -Path $report -Pattern 'COMPLETED WITHOUT CRASH' -Quiet)) {
            Write-Host ("::error title=Self-test::did not complete; its last line: " + (Get-Content $report | Select-Object -Last 1))
            exit 1
          }

      # The interpolation kernels of the platform against the scalar one (AVX2 and
      # SSE2 on x86-64, NEON on Apple silicon) and their speed. Runs everywhere, the
      # macOS runners included; a mismatch fails the step, not the artifacts.
      - name: Kernel test (SIMD kernels vs scalar, speed)
        continue-on-error: true
        shell: pwsh
        env:
          LC_ALL: ${{ runner.os == 'Linux' && 'C.UTF-8' || 'en_US.UTF-8' }}
        run: |
          if ($IsWindows) { $exe = "build/LibreOrgan_artefacts/Release/LibreOrgan.exe" }
          elseif ($IsMacOS) { $exe = "build/LibreOrgan_artefacts/Release/LibreOrgan.app/Contents/MacOS/LibreOrgan" }
          else { $exe = "build/LibreOrgan_artefacts/Release/LibreOrgan" }
          $out = Join-Path ([IO.Path]::GetTempPath()) "kerneltest.txt"
          if ($IsWindows) {
            # a window program: waited for, its output taken into a file
            $p = Start-Process -FilePath $exe -ArgumentList '--kerneltest' -PassThru -NoNewWindow -RedirectStandardOutput $out
            if (-not $p.WaitForExit(600000)) { $p.Kill(); Write-Host "::error title=Kernel test::did not end within 10 minutes"; exit 1 }
            $code = $p.ExitCode
          }
          elseif ($IsLinux) { xvfb-run -a $exe --kerneltest | Tee-Object -FilePath $out; $code = $LASTEXITCODE }
          else { & $exe --kerneltest | Tee-Object -FilePath $out; $code = $LASTEXITCODE }
          if ($IsWindows -and (Test-Path $out)) { Get-Content $out | Select-Object -Last 30 }
          if ($code -ne 0) {
            $why = if (Test-Path $out) { (Get-Content $out | Select-String -Pattern 'MISMATCH|WRONG|FAIL' | Select-Object -First 3 | ForEach-Object { $_.Line.Substring(0, [Math]::Min(300, $_.Line.Length)) }) -join ' || ' } else { 'no output' }
            Write-Host "::error title=Kernel test::exit code $code - $why"
            exit 1
          }

      # 24 Nov 2026 (#267: a MacBook Air M2 and a Mac mini M4 said the app is "damaged"): the build signs the bundle
      # ad hoc, and CMakeLists.txt then replaces its icon (AppIcon.icns) - the signature's seal over the bundle's
      # resources no longer fits, and on Apple silicon macOS calls a downloaded app with a broken signature damaged.
      # The bundle is signed again here, when nothing of it changes any more, and the signature is checked.
      - name: Sign the app bundle ad hoc (macOS - after the last change to it)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - "${{ matrix.path }}"
          codesign --verify --deep --strict --verbose=2 "${{ matrix.path }}"

      - name: Package (macOS - zip of the app bundle)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "${{ matrix.path }}" "${{ matrix.package }}"

      - name: Package (Windows - zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "${{ matrix.path }}" -DestinationPath "${{ matrix.package }}" -CompressionLevel Optimal

      - name: Package (Linux - tar.gz, executable bit kept)
        if: runner.os == 'Linux'
        run: |
          chmod +x "${{ matrix.path }}"
          tar -czf "${{ matrix.package }}" -C "$(dirname "${{ matrix.path }}")" "$(basename "${{ matrix.path }}")"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.package }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    # a download or an upload that hangs (v0.9.134, third attempt) ends here, not after six hours
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
      # Every build is a pre-release for testers until the first release the
      # project is satisfied with; the badge says so on the releases page.
      # 25 Nov 2026 (v0.9.134: every build green, softprops/action-gh-release failed three attempts with "Too many
      # retries" and nothing to read without a login): the release is made by GitHub's own gh here - a draft with
      # the archives, published when they are all up - and a failure says WHY in an annotation. A release or draft
      # of this tag left by an earlier attempt is replaced, so the job can be run again.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          mapfile -t files < <(find artifacts -type f | sort)
          echo "archives: ${#files[@]}"; printf '  %s\n' "${files[@]}"
          if [ "${#files[@]}" -lt 4 ]; then echo "::error title=Release::only ${#files[@]} archive(s) came from the builds"; exit 1; fi
          cat > notes.md <<'NOTES'
          Pre-release build for testers - not an official release yet.

          **One program, no installation: download the archive of your system below, unpack it, start the program.**

          - **Windows 10/11 (64-bit):** `LibreOrgan-windows.zip` - `LibreOrgan.exe` inside.
          - **macOS, Apple silicon (macOS 11 Big Sur or newer):** `LibreOrgan-macos.zip` - the app inside. Not notarised by Apple: macOS blocks the first start - allow it in System Settings > Privacy & Security > **Open Anyway** (older macOS: right-click > Open).
          - **macOS, Intel (macOS 10.11 El Capitan or newer):** `LibreOrgan-macos-10.11-intel.zip` - the app inside. Not notarised by Apple: right-click > Open the first time (newer macOS: System Settings > Privacy & Security > **Open Anyway**).
          - **Linux x86-64 (glibc 2.38 or newer: Ubuntu 24.04, Mint 22, Debian 13, Fedora 39 and newer):** `LibreOrgan-linux-x86_64.tar.gz` - `tar xzf` it; the program is executable as it comes.
          - **Linux arm64 - Raspberry Pi 4/5 with a 64-bit OS (Raspberry Pi OS Bookworm or newer, glibc 2.35+):** `LibreOrgan-linux-arm64.tar.gz` - `tar xzf` it. A test build, not yet tried on real hardware by the project.
          - The two *Source code* entries are added by GitHub to every release: not needed for playing.

          **Organs to play: [Configurations, Organs](https://github.com/zurek-jiri/LibreOrgan/blob/main/libreorgans/INDEX.md)** - ready-made configurations for sample folders in wave format from [Sonus Paradisi](https://www.sonusparadisi.cz/en/organs.html) ([free material](https://www.sonusparadisi.cz/en/free-stuff.html)); to start at once, [the Rural Organ demo](https://github.com/zurek-jiri/LibreOrgan/releases/tag/rural-organ-0.8) brings its own sample folders.
          NOTES
          for old in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft --jq '.[] | select((.isDraft and (.tagName | startswith("v"))) or .tagName == "'"$tag"'") | .tagName' | awk '!seen[$0]++'); do
            echo "an earlier attempt's release $old goes first"
            gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes || true
          done
          if ! out=$(gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --title "$tag" --notes-file notes.md 2>&1); then
            echo "$out"
            echo "::error title=Release::$(echo "$out" | tail -n 3 | tr '\n' ' ' | cut -c1-400)"
            exit 1
          fi
          echo "$out"
      # 0.9.101 (the user: "na GitHubu tentokrát nechej i starou verzi, kdyby tato s VST kulhala ... pak ji časem zase
      # zrušíme"): a release named in `keep` below stays beside the current one. 28 Nov 2026 (the user deleted
      # v0.9.100 by hand: "Nebudeme to držet"): `keep` is empty - one release again. 28 Nov 2026 evening (0.9.152,
      # the recorded tremulants; the user: "tentokrát zachovej i stávající verzi. Tu vymažeme až někdy"):
      # v0.9.149 stays beside the current release until he says to drop it (then keep="").
      # ONE current release only (0.9.80: the previous version kept since 0.9.77 pushed the Rural Organ
      # demo release down the page - GitHub sorts releases by date, nothing can be pinned); every older
      # v* release (and its tag) is deleted; the Rural Organ demo release is kept.
      - name: Delete the older program releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="${GITHUB_REF_NAME}"
          keep="v0.9.149"
          # Newest first; each tag once (a release listed twice made the second delete fail on the tag
          # already gone, 0.8.154); a release or tag gone by then is no failure.
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[].tagName' | awk '!seen[$0]++'); do
            case "$tag" in
              v*) if [ "$tag" = "$current" ] || [ "$tag" = "$keep" ]; then continue; fi
                  echo "deleting $tag"
                  gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || echo "$tag: already gone" ;;
            esac
          done
